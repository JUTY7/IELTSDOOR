<!DOCTYPE html>
<html>
<head>
<title>IELTS Reading - IELTS DOOR</title>

<style>

body{
 font-family:Arial;
 background:#eef2ff;
 text-align:center;
 padding:20px;
}

.dark{
 background:#0b1220;
 color:white;
}

h1{color:#0b5ed7;}
.dark h1{color:#9ec5ff;}

.box{
 background:white;
 width:95%;
 max-width:1100px;
 margin:auto;
 padding:15px;
 border-radius:18px;
 box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

.dark .box{
 background:#111c3a;
}

/* HEADER */
.exam-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:#002a6d;
 color:white;
 padding:12px 18px;
 border-radius:12px;
 margin-bottom:15px;
 flex-wrap:wrap;
}

#timer{
 background:#0b6efd;
 padding:8px 15px;
 border-radius:30px;
 font-size:17px;
 font-weight:bold;
}

/* LAYOUT */
.container{
 display:flex;
 gap:10px;
 height:550px;
}

.panel{
 background:#f4f6ff;
 border:1.5px solid #c7d3ff;
 border-radius:10px;
 padding:10px;
 overflow-y:auto;
 width:50%;
}

.dark .panel{
 background:#1b2b52;
 border-color:#4b6fdd;
}

/* RESIZE BAR */
.resize{
 width:6px;
 background:#0b6efd;
 cursor:col-resize;
 border-radius:20px;
}

/* QUESTIONS */
.questionBox{
 background:#ffffff;
 border:1.5px solid #c7d3ff;
 padding:10px;
 border-radius:10px;
 margin:8px 0;
}
.dark .questionBox{
 background:#1b2b52;
 border-color:#4b6fdd;
}

button{
 background:#0d6efd;
 color:white;
 padding:10px 18px;
 border:none;
 border-radius:30px;
 margin:6px;
 cursor:pointer;
 font-size:15px;
 font-weight:bold;
}
button:hover{background:#073a8f;}
button:disabled{
 background:gray;
 cursor:not-allowed;
}

.submit-btn{background:#28a745;}
.submit-btn:hover{background:#1f7a33;}

/* Question circles */
.circle{
 display:inline-block;
 width:35px;
 height:35px;
 border-radius:50%;
 border:2px solid #0d6efd;
 margin:4px;
 color:#0d6efd;
 font-weight:bold;
 line-height:35px;
 cursor:pointer;
 background:white;
}
.circle.answered{
 background:#0d6efd;
 color:white;
}

#modeBtn{background:black;}

@media(max-width:700px){
 .container{
  flex-direction:column;
  height:auto;
 }
 .panel{
  width:100%;
  height:300px;
 }
 .resize{display:none;}
}

</style>
</head>

<body>

<h1>IELTS Reading Test</h1>

<button id="modeBtn" onclick="toggleMode()">Toggle Dark Mode 🌙</button>

<div class="box">

<div class="exam-header">
 <h2 id="title">Reading Passage 1</h2>
 <div id="timer">60:00</div>
</div>

<div class="container">

<div class="panel" id="passage">
<h3>Passage Text Goes Here</h3>
<p>You will later replace this with your real IELTS passage.</p>
</div>

<div class="resize" id="drag"></div>

<div class="panel">
<div id="questions"></div>
</div>

</div>

<div style="margin-top:10px;">
<button onclick="prevPassage()">Previous</button>
<button onclick="nextPassage()">Next</button>
<button class="submit-btn" onclick="submitExam()">Submit</button>
</div>

<div id="circles"></div>

<p id="result"></p>

</div>

<script>

// ========== SETTINGS ==========
let passage = parseInt(localStorage.getItem("readingPassage")) || 1;
let answers = JSON.parse(localStorage.getItem("readingAnswers")) || new Array(40).fill(null);

// Question Distribution
const passageCount = {
 1:13,
 2:13,
 3:14
};

let questions = [];
for(let i=1;i<=40;i++){
 questions.push({
  q:`Question ${i}`,
  options:["A","B","C","D"],
  answer:"A"
 });
}


// ========== TIMER WITH WARNING & AUTO SUBMIT ==========
let savedTime = localStorage.getItem("readingTime");
let time = savedTime ? parseInt(savedTime) : 60*60;
let warned=false;

let timer=setInterval(()=>{
 let m=Math.floor(time/60);
 let s=time%60;
 if(s<10) s="0"+s;
 document.getElementById("timer").innerHTML=`${m}:${s}`;
 localStorage.setItem("readingTime",time);
 time--;

 if(time===60 && !warned){
  warned=true;
  alert("⚠️ Only 1 minute left! Hurry up!");
 }

 if(time<0){
  clearInterval(timer);
  alert("⏰ Time over! Auto submitting");
  submitExam();
 }

},1000);


// ========== RENDER ==========
function render(){

 localStorage.setItem("readingPassage",passage);

 let startIndex = passage===1?0 : passage===2?13:26;
 let total = passageCount[passage];

 document.getElementById("title").innerHTML=
 `Reading Passage ${passage} — Questions ${startIndex+1} to ${startIndex+total}`;

 renderQuestions(startIndex,total);
 renderCircles(startIndex,total);
}


// ========== QUESTIONS ==========
function renderQuestions(start,total){

 let html="";
 for(let i=start;i<start+total;i++){
  html+=`
  <div class="questionBox">
   <b>${questions[i].q}</b><br>
   ${questions[i].options.map(opt=>`
    <label>
     <input type="radio"
     name="q${i}"
     value="${opt}"
     ${answers[i]===opt?"checked":""}
     onchange="saveAns(${i},'${opt}')">
     ${opt}
    </label><br>
   `).join("")}
  </div>
  `;
 }

 document.getElementById("questions").innerHTML=html;
}

function saveAns(i,val){
 answers[i]=val;
 localStorage.setItem("readingAnswers",JSON.stringify(answers));
 render();
}


// ========== CIRCLES ==========
function renderCircles(start,total){

 let div=document.getElementById("circles");
 div.innerHTML="";

 for(let i=start;i<start+total;i++){
  let c=document.createElement("div");
  c.className="circle";
  c.innerHTML=i+1;
  if(answers[i]) c.classList.add("answered");
  div.appendChild(c);
 }
}


// ========== NAVIGATION ==========
function nextPassage(){
 if(passage<3){
  passage++;
  render();
 }
}

function prevPassage(){
 if(passage>1){
  passage--;
  render();
 }
}


// ========== SUBMIT ==========
function submitExam(){

 clearInterval(timer);

 let correct=0;
 answers.forEach((a,i)=>{
  if(a===questions[i].answer) correct++;
 });

 let incorrect=40-correct;
 let band=getBand(correct);

 document.getElementById("questions").innerHTML=`
 <h2>Result</h2>
 <p><b>Total Questions:</b> 40</p>
 <p><b>Correct:</b> ${correct}</p>
 <p><b>Incorrect:</b> ${incorrect}</p>
 <p><b>Band Score:</b> ${band}</p>
 `;

 document.getElementById("circles").innerHTML="";
 document.getElementById("title").innerHTML="Reading Completed";

 localStorage.removeItem("readingTime");
 localStorage.removeItem("readingAnswers");
}


// ========== BAND SCALE ==========
function getBand(c){
 if(c>=39) return 9;
 if(c>=37) return 8.5;
 if(c>=35) return 8;
 if(c>=33) return 7.5;
 if(c>=30) return 7;
 if(c>=27) return 6.5;
 if(c>=23) return 6;
 if(c>=19) return 5.5;
 if(c>=15) return 5;
 if(c>=12) return 4.5;
 return 0;
}


// ========== RESIZE PANEL ==========
let drag=document.getElementById("drag");
let left=document.getElementById("passage");
let right=document.querySelectorAll(".panel")[1];

drag.onmousedown=function(e){
 document.onmousemove=function(e){
  let percent = (e.clientX / window.innerWidth)*100;
  if(percent>20 && percent<80){
   left.style.width=percent+"%";
   right.style.width=(95-percent)+"%";
  }
 }
 document.onmouseup=function(){
  document.onmousemove=null;
 }
}


// ========== DARK MODE ==========
function toggleMode(){
 document.body.classList.toggle("dark");
 localStorage.setItem("readingDark",
 document.body.classList.contains("dark"));
}

if(localStorage.getItem("readingDark")==="true"){
 document.body.classList.add("dark");
}

render();

</script>

</body>
</html>
