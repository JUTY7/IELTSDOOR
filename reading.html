<!DOCTYPE html>
<html>
<head>
<title>Reading - IELTS DOOR</title>
<style>
body { font-family: Arial; background:#f5f5f5; text-align:center; padding:50px; }
h1 { color:#0d6efd; font-size:40px; }
.box { background:white; width:650px; margin:auto; padding:30px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.3); text-align:left; }
button { background:#0d6efd; color:white; padding:12px 20px; border:none; border-radius:6px; font-size:16px; cursor:pointer; margin:10px; }
button:hover { background:#0948a1; }
label { display:block; margin:15px 0; font-size:16px; }
#timer { font-size:18px; font-weight:bold; color:#0d6efd; margin-bottom:15px; }
</style>
</head>
<body>

<h1>Reading Section</h1>
<div class="box">
  <div id="timer">Time Left: 10:00</div>
  <form id="readingForm">
    <p>Passage Placeholder: "This is a short reading passage..."</p>

    <p>1. Question placeholder?</p>
    <label><input type="radio" name="q1" value="A"> Option A</label>
    <label><input type="radio" name="q1" value="B"> Option B</label>
    <label><input type="radio" name="q1" value="C"> Option C</label>

    <p>2. Question placeholder?</p>
    <label><input type="radio" name="q2" value="A"> Option A</label>
    <label><input type="radio" name="q2" value="B"> Option B</label>
    <label><input type="radio" name="q2" value="C"> Option C</label>

    <button type="button" onclick="checkAnswers()">Submit Answers</button>
  </form>
  <p id="result"></p>
  <button onclick="window.location.href='index.html'">Back to Home</button>
</div>

<script>
let totalTime = 600; // 10 minutes
let timer = document.getElementById('timer');
let countdown = setInterval(() => {
  let minutes = Math.floor(totalTime/60);
  let seconds = totalTime % 60;
  if(seconds<10) seconds='0'+seconds;
  timer.innerText = `Time Left: ${minutes}:${seconds}`;
  totalTime--;
  if(totalTime < 0){
    clearInterval(countdown);
    alert('Time is up!');
    checkAnswers();
  }
},1000);

function checkAnswers(){
  let form = document.getElementById('readingForm');
  let score = 0;
  if(form.q1.value==="A") score++;
  if(form.q2.value==="B") score++;
  document.getElementById('result').innerText = `Your Score: ${score}/2`;
  clearInterval(countdown);
}
</script>

</body>
</html>
