<!DOCTYPE html>
<html>
<head>
<title>IELTS Reading - IELTS DOOR</title>
<style>
body { font-family: Arial; background:#f5f5f5; margin:0; padding:0; }
h1 { color:#0d6efd; text-align:center; padding:20px 0; }
#timer { text-align:center; font-size:20px; font-weight:bold; color:#0d6efd; margin-bottom:10px; }
.container { display:flex; height:70vh; margin:20px; background:white; border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.3); overflow:hidden; }
.passage, .questions { padding:20px; overflow-y:auto; }
.passage { background:#f0f8ff; width:50%; resize:horizontal; min-width:200px; max-width:80%; }
.questions { width:50%; resize:horizontal; min-width:200px; max-width:80%; border-left:2px solid #0d6efd; }
button { background:#0d6efd; color:white; padding:8px 12px; border:none; border-radius:5px; cursor:pointer; margin:3px; }
button:hover { background:#0948a1; }
.qnumContainer { text-align:center; margin-top:10px; }
.qnumBtn { display:inline-block; width:30px; height:30px; border-radius:50%; border:1px solid #0d6efd; margin:3px; cursor:pointer; background:white; color:#0d6efd; line-height:30px; font-weight:bold; }
.qnumBtn.answered { background:#0d6efd; color:white; }
#navButtons { text-align:center; margin:15px 0; }
#result { text-align:center; font-size:18px; color:#0d6efd; font-weight:bold; }
textarea { width:95%; margin-bottom:8px; font-size:16px; }
</style>
</head>
<body>

<h1>IELTS Reading Section</h1>
<div id="timer">Time Left: 60:00</div>

<div class="container">
  <div class="passage" id="passageContainer"></div>
  <div class="questions" id="questionsContainer"></div>
</div>

<div class="qnumContainer" id="qnumContainer"></div>

<div id="navButtons">
  <button onclick="prevPassage()">Previous Passage</button>
  <button onclick="nextPassage()">Next Passage</button>
  <button onclick="submitReading()">Submit Exam</button>
</div>

<p id="result"></p>

<script>
// === CONFIGURATION ===
const passages = [
  { text: "Passage 1 text goes here...", questions: 13 },
  { text: "Passage 2 text goes here...", questions: 13 },
  { text: "Passage 3 text goes here...", questions: 14 }
];

let currentPassage = 0;
let answers = passages.map(p=>Array(p.questions).fill(null));

// === TIMER ===
let totalTime = 60*60; // 60 minutes
const timerEl = document.getElementById('timer');
const countdown = setInterval(()=>{
  let minutes = Math.floor(totalTime/60);
  let seconds = totalTime % 60;
  if(seconds<10) seconds='0'+seconds;
  timerEl.innerText = `Time Left: ${minutes}:${seconds}`;
  totalTime--;
  if(totalTime<0){
    clearInterval(countdown);
    alert("Time's up!");
    submitReading();
  }
},1000);

// === RENDER PASSAGE & QUESTIONS ===
function renderPassage(){
  const passageEl = document.getElementById('passageContainer');
  const questionsEl = document.getElementById('questionsContainer');
  const qnumContainer = document.getElementById('qnumContainer');
  
  passageEl.innerText = passages[currentPassage].text;
  
  let qHtml = '';
  for(let i=0;i<passages[currentPassage].questions;i++){
    qHtml += `<p>Question ${i+1}</p>`;
    ['A','B','C','D'].forEach(opt=>{
      qHtml += `<label><input type="radio" name="q${i}" value="${opt}" ${answers[currentPassage][i]===opt?"checked":""} onchange="selectAnswer(${i}, this)"> ${opt}</label>`;
    });
  }
  questionsEl.innerHTML = qHtml;
  
  // Question number buttons
  qnumContainer.innerHTML = '';
  for(let i=0;i<passages[currentPassage].questions;i++){
    const btn = document.createElement('div');
    btn.className = 'qnumBtn';
    if(answers[currentPassage][i]) btn.classList.add('answered');
    btn.innerText = i+1;
    btn.onclick = ()=>{ scrollToQuestion(i); };
    qnumContainer.appendChild(btn);
  }
}

// === SELECT ANSWER ===
function selectAnswer(index,input){
  answers[currentPassage][index] = input.value;
  renderPassage();
}

// === SCROLL TO QUESTION ===
function scrollToQuestion(index){
  const questionsEl = document.getElementById('questionsContainer');
  const questionLabel = questionsEl.querySelectorAll('p')[index*2];
  questionLabel.scrollIntoView({behavior:'smooth', block:'start'});
}

// === NAVIGATION ===
function nextPassage(){ if(currentPassage<passages.length-1){currentPassage++; renderPassage();} }
function prevPassage(){ if(currentPassage>0){currentPassage--; renderPassage();} }

// === SUBMIT EXAM ===
function submitReading(){
  clearInterval(countdown);
  let totalQuestions=0;
  let answeredCount=0;
  answers.forEach(pArr=>{
    totalQuestions+=pArr.length;
    answeredCount+=pArr.filter(a=>a!==null).length;
  });
  document.getElementById('result').innerText = `You answered ${answeredCount} out of ${totalQuestions} questions`;
}

// INITIAL RENDER
renderPassage();
</script>

</body>
</html>
