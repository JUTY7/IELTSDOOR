<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Speaking - IELTS DOOR</title>
<style>
/* ======== BODY & CONTAINER ======== */
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
  transition: background 0.3s, color 0.3s;
}
body.dark-mode {
  background: #121212;
  color: #e0e0e0;
}
h1 {
  color: #0d6efd;
  text-align: center;
  margin-bottom: 20px;
}
.container {
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  transition: background 0.3s, color 0.3s;
}
body.dark-mode .container {
  background: #1e1e1e;
  color: #e0e0e0;
}

/* ======== BUTTONS ======== */
button {
  background: #0d6efd;
  color: white;
  padding: 10px 18px;
  border: none;
  border-radius: 6px;
  margin: 5px;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.2s;
}
button:hover { background: #073a8f; }

/* ======== RESULTS ======== */
#speakingResult {
  margin-top: 25px;
  font-size: 18px;
  line-height: 1.5;
  text-align: left;
}

/* ======== DARK MODE TOGGLE ======== */
#darkModeToggle {
  float: right;
  margin-top: -50px;
}

/* ======== RESPONSIVE ======== */
@media(max-width:600px){
  .container{padding:15px;}
  button{font-size:14px;padding:8px 12px;}
}
</style>
</head>
<body>

<h1>IELTS Speaking Test</h1>

<div class="container">
  <!-- Dark Mode Toggle -->
  <button id="darkModeToggle" onclick="toggleDarkMode()">Dark Mode</button>

  <p>
    Press <b>Start Recording</b> to speak, then <b>Stop & Submit</b> to get your AI Band Score.
  </p>

  <!-- Recording Buttons -->
  <button onclick="startRecording()">Start Recording</button>
  <button onclick="stopRecording()">Stop & Submit</button>

  <!-- Result Section -->
  <div id="speakingResult"></div>
</div>

<script>
let mediaRecorder;
let audioChunks = [];

// ===== RECORD AUDIO =====
function startRecording() {
  navigator.mediaDevices.getUserMedia({ audio: true })
  .then(stream => {
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.start();
    audioChunks = [];

    mediaRecorder.addEventListener("dataavailable", event => {
      audioChunks.push(event.data);
    });

    mediaRecorder.addEventListener("stop", () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
      sendToServer(audioBlob);
    });

    alert("Recording started!");
  })
  .catch(err => alert("Microphone access denied or not available."));
}

function stopRecording() {
  if(mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
    alert("Recording stopped!");
  }
}

// ===== SEND AUDIO TO ONLINE SERVER =====
function sendToServer(audioBlob) {
  const formData = new FormData();
  formData.append("audio", audioBlob, "recording.wav");

  fetch("https://ielts-speaking.onrender.com/api/speaking-score", {  // <-- ONLINE SERVER
    method: "POST",
    body: formData
  })
  .then(response => response.json())
  .then(data => {
    if(data.error){
      alert("Error getting score. Try again.");
      return;
    }
    document.getElementById("speakingResult").innerHTML = `
      <h3>Band Score: ${data.band}</h3>
      <p><b>Fluency & Coherence:</b> ${data.fluency}</p>
      <p><b>Lexical Resource:</b> ${data.lexical}</p>
      <p><b>Grammatical Range & Accuracy:</b> ${data.grammar}</p>
      <p><b>Pronunciation:</b> ${data.pronunciation}</p>
    `;
  })
  .catch(err => console.error(err));
}

// ===== DARK MODE =====
function toggleDarkMode() {
  document.body.classList.toggle("dark-mode");
}

// ===== OPTIONAL: AUTO-SAVE =====
window.addEventListener("beforeunload", function(e) {
  // can save student progress here if needed
});
</script>

</body>
</html>
