<!DOCTYPE html>
<html>
<head>
<title>IELTS DOOR</title>
<style>
body {
  font-family: Arial;
  background: #0d6efd;
  color: white;
  text-align: center;
  padding-top: 50px;
}
h1 { font-size: 50px; margin-bottom: 10px; }
p.subtitle { font-size: 20px; margin-bottom: 50px; }
.box {
  background: white;
  color: black;
  width: 500px;
  margin: auto;
  padding: 40px;
  border-radius: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
button {
  background: #0d6efd;
  color: white;
  padding: 15px 30px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  margin: 10px;
  transition: 0.3s;
}
button:hover { background: #0948a1; }
</style>
</head>
<body>

<h1>IELTS DOOR</h1>
<p class="subtitle">Your Gateway To Computer-Based IELTS</p>

<div class="box">
  <h2>Select a Section</h2>
  <button onclick="window.location.href='listening.html'">Listening</button>
  <button onclick="window.location.href='reading.html'">Reading</button>
  <button onclick="window.location.href='writing.html'">Writing</button>
  <button onclick="window.location.href='speaking.html'">Speaking</button>
</div>

</body>
</html>
