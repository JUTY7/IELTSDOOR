<!DOCTYPE html>
<html>
<head>
<title>IELTS Listening - IELTS DOOR</title>
<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; text-align:center; }
h1 { color:#0d6efd; }
.box { background:white; width:900px; margin:auto; padding:20px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.3); text-align:left; }

button{background:#0d6efd;color:white;padding:10px 15px;border:none;border-radius:6px;margin:5px;cursor:pointer;}
button:hover{background:#0a49b1;}

#timer{font-size:18px;font-weight:bold;color:#0d6efd;margin-bottom:10px;}

.pageButtons{margin-top:10px;text-align:center;}
.pageBtn{display:inline-block;width:35px;height:35px;border-radius:50%;border:1px solid #0d6efd;margin:4px;cursor:pointer;
line-height:35px;font-weight:bold;color:#0d6efd;background:white;}
.pageBtn.answered{background:#0d6efd;color:white;}

.questionBox{margin:10px 0;padding:10px;border-radius:8px;background:#eef5ff;}
</style>
</head>

<body>

<h1>IELTS Listening Test</h1>

<div class="box">

<div id="timer">Time Left: 32:00</div>

<audio id="audioPlayer" controls style="width:100%; margin-bottom:15px;">
  <source src="listening_full.mp3" type="audio/mpeg">
</audio>

<h2 id="title"></h2>

<div id="questions"></div>

<div class="pageButtons">
<button onclick="prevPage()">Previous</button>
<button onclick="nextPage()">Next</button>
<button onclick="submitExam()">Submit</button>
</div>

<div id="numbers" class="pageButtons"></div>

<p id="result"></p>

</div>

<script>

// ===== DATA =====
let totalQuestions = 40;
let questionsPerPage = 10;
let currentPage = 1;

let answers = new Array(40).fill(null);

// create dummy questions
let questions = [];
for(let i=1;i<=40;i++){
  questions.push({
    q:`Question ${i}`,
    options:["A","B","C","D"],
    answer:"A"
  });
}

// ===== TIMER =====
let time = 32*60;
let t = setInterval(()=>{
 let m = Math.floor(time/60);
 let s = time%60;
 if(s<10) s="0"+s;
 document.getElementById("timer").innerHTML = `Time Left: ${m}:${s}`;
 time--;
 if(time<0){
   clearInterval(t);
   alert("Time's up!");
   submitExam();
 }
},1000);


// ===== RENDER PAGE =====
function renderPage(){
 let start = (currentPage-1)*10;
 let end = start+10;

 document.getElementById("title").innerText =
   `Listening Section — Questions ${start+1} to ${end}`;

 let html = "";

 for(let i=start;i<end;i++){
  html += `<div class="questionBox">
  <b>${questions[i].q}</b><br>`;

  questions[i].options.forEach(opt=>{
      html+=`<label>
      <input type="radio" name="q${i}"
      value="${opt}"
      ${answers[i]===opt?"checked":""}
      onchange="selectAnswer(${i},'${opt}')"> ${opt}</label><br>`;
  });

  html+=`</div>`;
 }

 document.getElementById("questions").innerHTML = html;
 renderButtons();
}


// ===== SELECT ANSWER =====
function selectAnswer(i,opt){
 answers[i]=opt;
 renderButtons();
}


// ===== PAGE BUTTON INDICATORS =====
function renderButtons(){
 let div = document.getElementById("numbers");
 div.innerHTML="";

 for(let i=0;i<40;i++){
  let btn = document.createElement("div");
  btn.className="pageBtn";
  
  if(answers[i]) btn.classList.add("answered");

  btn.innerHTML=i+1;
  btn.onclick=function(){
     currentPage = Math.floor(i/10)+1;
     renderPage();
  }
  div.appendChild(btn);
 }
}


// ===== NAVIGATION =====
function nextPage(){
 if(currentPage<4){
  currentPage++;
  renderPage();
 }
}

function prevPage(){
 if(currentPage>1){
  currentPage--;
  renderPage();
 }
}


// ===== SUBMIT =====
function submitExam(){

 clearInterval(t);

 let score=0;
 for(let i=0;i<40;i++){
  if(answers[i]===questions[i].answer) score++;
 }

 let percent = (score/40)*100;
 let band = getBand(percent);

 document.getElementById("questions").innerHTML = `
 <h2>Result</h2>
 <p>Total Questions: 40</p>
 <p>Correct: ${score}</p>
 <p>Score: ${percent.toFixed(2)}%</p>
 <p>Band: ${band}</p>
 `;
 document.getElementById("numbers").innerHTML="";
 document.getElementById("title").innerHTML="Test Completed";
}


// ===== BAND CALC =====
function getBand(p){
 if(p>=90) return 9;
 if(p>=80) return 8.5;
 if(p>=70) return 8;
 if(p>=60) return 7;
 if(p>=50) return 6;
 if(p>=40) return 5;
 return 4;
}

renderPage();
</script>

</body>
</html>
