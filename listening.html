<!DOCTYPE html>
<html>
<head>
<title>IELTS Listening - IELTS DOOR</title>
<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; text-align:center; }
h1 { color:#0d6efd; font-size:36px; margin-bottom:15px; }
.box { background:white; width:800px; margin:auto; padding:25px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.3); text-align:left; }
button { background:#0d6efd; color:white; padding:10px 15px; border:none; border-radius:6px; cursor:pointer; margin:5px; }
button:hover { background:#0948a1; }
label { display:block; margin:5px 0; font-size:16px; }
#timer { font-size:18px; font-weight:bold; color:#0d6efd; margin-bottom:15px; }
#sectionTitle { font-size:24px; color:#0d6efd; margin-bottom:10px; }
#questionContainer { margin-bottom:10px; }
.qnumContainer { margin-top:15px; text-align:center; }
.qnumBtn { display:inline-block; width:30px; height:30px; border-radius:50%; border:1px solid #0d6efd; margin:3px; cursor:pointer; background:white; color:#0d6efd; line-height:30px; font-weight:bold; }
.qnumBtn.answered { background:#0d6efd; color:white; }
</style>
</head>
<body>

<h1>IELTS Listening - Full Test</h1>
<div class="box">
  <div id="timer">Time Left: 32:00</div>

  <audio id="audioPlayer" controls style="width:100%; margin-bottom:15px;">
    <source src="listening_full.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div id="sectionTitle"></div>
  <div id="questionContainer"></div>
  <div class="qnumContainer" id="qnumContainer"></div>

  <div style="text-align:center; margin-top:15px;">
    <button onclick="prevQuestion()">Previous</button>
    <button onclick="nextQuestion()">Next</button>
    <button onclick="prevSection()">Previous Section</button>
    <button onclick="nextSection()">Next Section</button>
    <button onclick="submitExam()">Submit Exam</button>
  </div>

  <p id="result"></p>
</div>

<script>
// ===== CONFIGURATION =====
const totalSections = 4;
const questionsPerSection = 10;

// Create 4 sections with 10 questions each
let sections = [];
for(let s=0; s<totalSections; s++){
  let qArr = [];
  for(let i=1; i<=questionsPerSection; i++){
    qArr.push({q:`Section ${s+1} - Question ${i}`, options:["A","B","C","D"], answer:"A"});
  }
  sections.push({questions:qArr});
}

// ===== TRACKERS =====
let currentSection = 0;
let currentQuestion = 0;
let answers = sections.map(sec => Array(sec.questions.length).fill(null));

// ===== TIMER =====
let totalTime = 32*60;
const timerEl = document.getElementById('timer');
const countdown = setInterval(()=>{
  let minutes = Math.floor(totalTime/60);
  let seconds = totalTime % 60;
  if(seconds<10) seconds='0'+seconds;
  timerEl.innerText = `Time Left: ${minutes}:${seconds}`;
  totalTime--;
  if(totalTime<0){
    clearInterval(countdown);
    alert("Time's up!");
    submitExam();
  }
},1000);

// ===== RENDER QUESTION =====
function renderQuestion(){
  const section = sections[currentSection];
  const q = section.questions[currentQuestion];

  document.getElementById('sectionTitle').innerText = `Section ${currentSection+1} - Question ${currentQuestion+1}`;

  let html = `<p>${q.q}</p>`;
  q.options.forEach(opt=>{
    html += `<label><input type="radio" name="answer" value="${opt}" ${answers[currentSection][currentQuestion]===opt?"checked":""} onchange="selectAnswer(this)"> ${opt}</label>`;
  });
  document.getElementById('questionContainer').innerHTML = html;

  renderQNumButtons();
}

// ===== SELECT ANSWER =====
function selectAnswer(input){
  answers[currentSection][currentQuestion] = input.value;
  renderQNumButtons();
}

// ===== QUESTION NUMBER BUTTONS =====
function renderQNumButtons(){
  const container = document.getElementById('qnumContainer');
  container.innerHTML = '';
  const qArr = sections[currentSection].questions;
  for(let i=0; i<qArr.length; i++){
    const btn = document.createElement('div');
    btn.className = 'qnumBtn';
    if(answers[currentSection][i]) btn.classList.add('answered');
    btn.innerText = i+1;
    btn.onclick = ()=>{ currentQuestion=i; renderQuestion(); };
    container.appendChild(btn);
  }
}

// ===== NAVIGATION =====
function nextQuestion(){ if(currentQuestion<questionsPerSection-1){ currentQuestion++; renderQuestion(); } }
function prevQuestion(){ if(currentQuestion>0){ currentQuestion--; renderQuestion(); } }
function nextSection(){ if(currentSection<totalSections-1){ currentSection++; currentQuestion=0; renderQuestion(); } }
function prevSection(){ if(currentSection>0){ currentSection--; currentQuestion=0; renderQuestion(); } }

// ===== SUBMIT =====
function submitExam(){
  clearInterval(countdown);
  let totalScore=0;
  sections.forEach((sec,sIdx)=>{
    sec.questions.forEach((q,qIdx)=>{
      if(answers[sIdx][qIdx]===q.answer) totalScore++;
    });
  });
  const totalQuestions = totalSections*questionsPerSection;
  const percentage = (totalScore/totalQuestions*100).toFixed(2);
  const band = calculateBand(percentage);

  document.getElementById('questionContainer').innerHTML = `<h2>🎯 Listening Result Dashboard</h2>
    <p>Total Questions: ${totalQuestions}</p>
    <p>Correct Answers: ${totalScore}</p>
    <p>Percentage Score: ${percentage}%</p>
    <p>Band Score: ${band}</p>`;
  document.getElementById('sectionTitle').innerText="Test Completed";
  document.getElementById('submitBtn')?.setAttribute('disabled', true);
}

// ===== CALCULATE BAND =====
function calculateBand(p){
  p=parseFloat(p);
  if(p>=90) return 9;
  if(p>=80) return 8.5;
  if(p>=70) return 8;
  if(p>=60) return 7;
  if(p>=50) return 6;
  if(p>=40) return 5;
  if(p>=30) return 4;
  return 3;
}

// INITIAL RENDER
renderQuestion();
</script>

</body>
</html>
