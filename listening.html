<!DOCTYPE html>
<html>
<head>
<title>Reading - IELTS DOOR</title>
<style>
body { font-family: Arial; background:#f5f5f5; text-align:center; padding:30px; }
h1 { color:#0d6efd; font-size:36px; margin-bottom:10px;}
.box { background:white; width:800px; margin:auto; padding:25px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.3); text-align:left; }
button { background:#0d6efd; color:white; padding:12px 20px; border:none; border-radius:6px; font-size:16px; cursor:pointer; margin:5px; }
button:hover { background:#0948a1; }
label { display:block; margin:8px 0; font-size:16px; }
#timer { font-size:18px; font-weight:bold; color:#0d6efd; margin-bottom:15px; }
#sectionTitle { font-size:24px; color:#0d6efd; margin-bottom:10px;}
#questionContainer { margin-bottom:15px; }
.qnumContainer { margin-top:15px; text-align:center; }
.qnumBtn { display:inline-block; width:30px; height:30px; border-radius:50%; border:1px solid #0d6efd; margin:3px; cursor:pointer; background:white; color:#0d6efd; line-height:30px; font-weight:bold; }
.qnumBtn.answered { background:#0d6efd; color:white; }
</style>
</head>
<body>

<h1>IELTS Reading - Full Test</h1>
<div class="box">
  <div id="timer">Time Left: 60:00</div>
  <div id="sectionTitle"></div>
  <div id="questionContainer"></div>

  <div class="qnumContainer" id="qnumContainer"></div>

  <div style="text-align:center; margin-top:15px;">
    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>
    <button id="submitBtn" onclick="submitExam()">Submit Exam</button>
  </div>
  
  <p id="result"></p>
  <button onclick="window.location.href='index.html'">Back to Home</button>
</div>

<script>
// === CONFIGURATION ===
let questions = [];
let answers = [];
let currentQuestionIndex = 0;

// === PASSAGES & QUESTIONS ===
// Passage 1: 13 questions
for(let i=1;i<=13;i++){
  questions.push({q:`Passage 1 - Question ${i}`, options:["A","B","C","D"], answer:"A"});
  answers.push(null);
}
// Passage 2: 13 questions
for(let i=14;i<=26;i++){
  questions.push({q:`Passage 2 - Question ${i}`, options:["A","B","C","D"], answer:"A"});
  answers.push(null);
}
// Passage 3: 14 questions
for(let i=27;i<=40;i++){
  questions.push({q:`Passage 3 - Question ${i}`, options:["A","B","C","D"], answer:"A"});
  answers.push(null);
}

// === TIMER ===
let totalTime = 60*60; // 60 minutes
const timerEl = document.getElementById('timer');
const countdown = setInterval(()=>{
  let minutes = Math.floor(totalTime/60);
  let seconds = totalTime % 60;
  if(seconds<10) seconds='0'+seconds;
  timerEl.innerText = `Time Left: ${minutes}:${seconds}`;
  totalTime--;
  if(totalTime<0){
    clearInterval(countdown);
    alert("Time's up!");
    submitExam();
  }
},1000);

// === RENDER QUESTION ===
function renderQuestion(){
  const container = document.getElementById('questionContainer');
  const sectionTitle = document.getElementById('sectionTitle');
  const q = questions[currentQuestionIndex];
  sectionTitle.innerText = `Question ${currentQuestionIndex+1}`;
  
  let html = `<p>${q.q}</p>`;
  q.options.forEach(opt=>{
    html += `<label><input type="radio" name="answer" value="${opt}" ${answers[currentQuestionIndex]===opt?"checked":""} onchange="selectAnswer(this)"> ${opt}</label>`;
  });
  container.innerHTML = html;
  renderQuestionNumbers();
}

// === SELECT ANSWER ===
function selectAnswer(input){
  answers[currentQuestionIndex] = input.value;
  renderQuestionNumbers();
}

// === QUESTION NUMBERS ===
function renderQuestionNumbers(){
  const container = document.getElementById('qnumContainer');
  container.innerHTML = '';
  questions.forEach((_, idx)=>{
    const btn = document.createElement('div');
    btn.className = 'qnumBtn';
    if(answers[idx]) btn.classList.add('answered');
    btn.innerText = idx+1;
    btn.onclick = ()=>{currentQuestionIndex=idx; renderQuestion();};
    container.appendChild(btn);
  });
}

// === NAVIGATION ===
function nextQuestion(){
  if(currentQuestionIndex<questions.length-1) currentQuestionIndex++;
  renderQuestion();
}
function prevQuestion(){
  if(currentQuestionIndex>0) currentQuestionIndex--;
  renderQuestion();
}

// === SUBMIT EXAM ===
function submitExam(){
  let score = 0;
  questions.forEach((q,idx)=>{
    if(answers[idx]===q.answer) score++;
  });
  const totalQuestions = questions.length;
  const percentage = (score/totalQuestions*100).toFixed(2);
  const band = calculateBand(percentage);

  document.getElementById('questionContainer').innerHTML = `<h2>🎯 Reading Result Dashboard</h2>
    <p>Total Questions: ${totalQuestions}</p>
    <p>Correct Answers: ${score}</p>
    <p>Percentage Score: ${percentage}%</p>
    <p>Band Score: ${band}</p>`;
  document.getElementById('sectionTitle').innerText = "Test Completed";
  document.getElementById('submitBtn').disabled = true;
  clearInterval(countdown);
}

// === BAND CALCULATION ===
function calculateBand(percentage){
  percentage = parseFloat(percentage);
  if(percentage>=90) return 9;
  if(percentage>=80) return 8.5;
  if(percentage>=70) return 8;
  if(percentage>=60) return 7;
  if(percentage>=50) return 6;
  if(percentage>=40) return 5;
  if(percentage>=30) return 4;
  return 3;
}

// === INITIAL RENDER ===
renderQuestion();
</script>

</body>
</html>
